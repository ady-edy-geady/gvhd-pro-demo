<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>cGVHD ePRO デモ</title>
<style>
  :root { --ink:#1c2530; --muted:#5b6874; --line:#d8dee6; --calm:#e9f1f8; --accent:#1a3d5c; }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:24px 16px 64px; background:#f4f6f8; color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-size:16px; line-height:1.7;
  }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:0.9rem; margin:0 0 24px; }
  .notice { background:var(--calm); border-radius:8px; padding:12px 14px; font-size:0.9rem; margin:0 0 20px; }
  .app { display:block; background:#fff; border:1px solid var(--line); border-radius:10px;
         padding:16px; margin-bottom:12px; text-decoration:none; color:inherit; }
  .app h2 { font-size:1.05rem; margin:0 0 4px; color:var(--accent); }
  .app p { margin:0; font-size:0.88rem; color:var(--muted); }
  footer { margin-top:28px; font-size:0.82rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>cGVHD ePRO デモ</h1>
  <p class="sub">慢性GVHDの症状記録と治療効果判定の試作版</p>

  <div class="notice">
    <strong>デモ用です。</strong>質問項目はすべて仮のもので、実際の尺度ではありません。
    入力した内容はお使いの端末の中にだけ残り、どこにも送信されません。
  </div>

  <a class="app" href="./patient/">
    <h2>患者用 — 症状の記録</h2>
    <p>症状とQOLを記録し、経過を確認します。受診時にQRコードで医療者へ渡します。</p>
  </a>

  <a class="app" href="./clinician/">
    <h2>医療者用 — PRO中継</h2>
    <p>QRを読み取り、NIH治療効果判定を入力し、カルテ移送用のCSVを出力します。</p>
  </a>

  <footer>
    このページは検索エンジンに登録されない設定にしていますが、URLを知っていれば誰でも開けます。
  </footer>
</main>
</body>
</html>
